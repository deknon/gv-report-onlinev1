<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ผลงานวันนี้</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#f5f5f0;
  font-family:'Sarabun',sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column;
}

/* ── HEADER ── */
.top-bar {
  background:#fff;
  border-bottom:1px solid #e8e8e2;
  padding:14px 20px 12px;
  display:flex; justify-content:space-between; align-items:flex-end;
}
.top-title { font-size:1.05rem; font-weight:800; color:#111; }
.top-date  { font-size:.75rem; color:#999; }

/* ── DATE PICKER (in header) ── */
select {
  border:1px solid #e0e0e0; background:#f9f9f7;
  color:#333; padding:4px 10px; border-radius:6px;
  font-family:'Sarabun',sans-serif; font-size:.8rem;
  outline:none; cursor:pointer;
}

/* ── TEAM TOTAL BAR ── */
.total-bar {
  background:#111; color:#fff;
  padding:10px 20px;
  display:flex; justify-content:space-between; align-items:center;
}
.total-label { font-size:.72rem; color:#aaa; }
.total-val   { font-size:1.3rem; font-weight:800; }
.total-block { text-align:center; }
.total-block:first-child { text-align:left; }
.total-block:last-child  { text-align:right; }

/* ── LIST ── */
.list { flex:1; overflow-y:auto; padding:10px 14px 80px; }

.row {
  background:#fff; border-radius:10px;
  padding:10px 14px; margin-bottom:8px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  animation:up .25s ease both;
}
@keyframes up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.row.me {
  border:2px solid #111;
  background:#fffef5;
}

/* rank */
.rank {
  font-size:.75rem; font-weight:800; color:#ccc;
  min-width:22px; text-align:center; flex-shrink:0;
}
.rank.r1 { color:#f5a800; font-size:1rem; }
.rank.r2 { color:#9e9e9e; font-size:.9rem; }
.rank.r3 { color:#a0673a; font-size:.85rem; }

/* name */
.name { font-size:1rem; font-weight:700; color:#111; flex:1; min-width:0; }

/* bar area */
.bars { flex:2; min-width:0; }

.bar-line { margin-bottom:3px; display:flex; align-items:center; gap:6px; }
.bar-line:last-child { margin-bottom:0; }

.bar-icon { font-size:.65rem; color:#999; width:10px; flex-shrink:0; }

.bar-wrap {
  flex:1; height:6px; background:#eee; border-radius:3px; overflow:hidden; position:relative;
}
.bar-fill { height:100%; border-radius:3px; transition:width .6s cubic-bezier(.34,1.56,.64,1); }
.bar-fill.pick  { background:#16a34a; }
.bar-fill.label { background:#38bdf8; }

.avg-tick {
  position:absolute; top:-1px; width:2px; height:8px;
  background:rgba(0,0,0,.2); border-radius:1px;
}

.bar-num { font-size:.9rem; font-weight:700; color:#555; min-width:26px; text-align:right; flex-shrink:0; }
.bar-num.pick  { color:#16a34a; }
.bar-num.label { color:#0284c7; }

/* avg line legend */
.legend {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 14px 8px; font-size:.68rem; color:#777;
  background:#fff; border-bottom:1px solid #e8e8e2;
}
.legend-item { display:flex; align-items:center; gap:5px; white-space:nowrap; }
.legend-bar  { width:14px; height:6px; border-radius:3px; flex-shrink:0; }
.legend-bar.pick  { background:#16a34a; }
.legend-bar.label { background:#38bdf8; }
.legend-avg-line  { width:2px; height:12px; background:rgba(0,0,0,.25); border-radius:1px; flex-shrink:0; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-title">📦 ผลงานวันนี้</div>
  <select id="date-select"></select>
</div>

<div class="total-bar">
  <div class="total-block">
    <div class="total-label">ทีม Pick รวม</div>
    <div class="total-val" id="sum-pick">—</div>
  </div>
  <div class="total-block">
    <div class="total-label">พนักงาน</div>
    <div class="total-val" id="sum-people" style="text-align:center">—</div>
  </div>
  <div class="total-block">
    <div class="total-label">ทีม Label รวม</div>
    <div class="total-val" id="sum-label">—</div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-bar pick"></div> PDA Picking</div>
  <div class="legend-item"><div class="legend-bar label"></div> Print Label</div>
  <div class="legend-item"><div class="legend-avg-line"></div> ค่าเฉลี่ยทีม</div>
</div>

<div class="list" id="list"></div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxjVwLftYspE6AajyR3FcTBMa-1gcXIZPLbDzl4O4qnen3tSDr-mX97Nv8mLXHDiN4U/exec';

let RAW = [];
const getName = op => op.split('@')[0].replace('st_','').charAt(0).toUpperCase() + op.split('@')[0].replace('st_','').slice(1);
const getAllDates = () => [...new Set(RAW.map(r=>r.date))].sort((a,b)=>new Date(b)-new Date(a));

function render(date) {
  if (!date) return;
  const day = RAW.filter(r=>r.date===date).sort((a,b)=>b.pda_pick-a.pda_pick);
  const n = day.length||1;
  const tPick  = day.reduce((s,r)=>s+r.pda_pick,0);
  const tLabel = day.reduce((s,r)=>s+r.print_labels,0);
  const aPick  = Math.round(tPick/n);
  const aLabel = Math.round(tLabel/n);
  const mPick  = Math.max(...day.map(r=>r.pda_pick),1);
  const mLabel = Math.max(...day.map(r=>r.print_labels),1);

  document.getElementById('sum-pick').textContent   = tPick.toLocaleString();
  document.getElementById('sum-label').textContent  = tLabel.toLocaleString();
  document.getElementById('sum-people').textContent = day.length;

  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!day.length) { list.innerHTML='<div style="padding:32px;text-align:center;color:#aaa">ไม่มีข้อมูล</div>'; return; }

  day.forEach((r, i) => {
    const rankSymbol = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    const rankClass  = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const pickW  = (r.pda_pick/mPick*100).toFixed(1);
    const labelW = (r.print_labels/mLabel*100).toFixed(1);
    const avgPW  = Math.min(aPick/mPick*100,100).toFixed(1);
    const avgLW  = Math.min(aLabel/mLabel*100,100).toFixed(1);

    const row = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = `${i*0.03}s`;
    row.innerHTML = `
      <div class="rank ${rankClass}">${rankSymbol}</div>
      <div class="name">${getName(r.operator)}</div>
      <div class="bars">
        <div class="bar-line">
          <div class="bar-wrap">
            <div class="bar-fill pick" style="width:${pickW}%"></div>
            <div class="avg-tick" style="left:${avgPW}%"></div>
          </div>
          <div class="bar-num pick">${r.pda_pick}</div>
        </div>
        <div class="bar-line">
          <div class="bar-wrap">
            <div class="bar-fill label" style="width:${labelW}%"></div>
            <div class="avg-tick" style="left:${avgLW}%"></div>
          </div>
          <div class="bar-num label">${r.print_labels}</div>
        </div>
      </div>`;
    list.appendChild(row);
  });
}

function initDateSelect() {
  const dates = getAllDates();
  const sel = document.getElementById('date-select');
  const cur = sel.value;
  sel.innerHTML = '';
  dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  sel.value = dates.includes(cur)?cur:dates[0];
  render(sel.value);
}
document.getElementById('date-select').addEventListener('change', e=>render(e.target.value));

// ─── LOAD FROM GOOGLE SHEETS ───
async function loadFromSheets() {
  const list = document.getElementById('list');
  list.innerHTML = '<div style="padding:32px;text-align:center;color:#aaa">⏳ กำลังโหลดข้อมูล...</div>';
  try {
    const res  = await fetch(SHEET_URL);
    const data = await res.json();
    RAW = data;
    initDateSelect();
  } catch(e) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:#e44">❌ โหลดข้อมูลไม่สำเร็จ<br><small>ตรวจสอบการตั้งค่า Google Sheets</small></div>';
  }
}

loadFromSheets();
</script>
</body>
</html>
