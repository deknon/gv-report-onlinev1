<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ผลงานวันนี้ v2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#f5f5f0;
  font-family:'Sarabun',sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column;
}

.top-bar {
  background:#111; color:#fff;
  padding:8px 16px;
  display:flex; align-items:center; gap:10px;
  flex-shrink:0;
}
.top-title { font-size:.9rem; font-weight:800; color:#fff; white-space:nowrap; flex-shrink:0; }

select {
  border:1px solid #444; background:#2a2a2a;
  color:#fff; padding:3px 8px; border-radius:6px;
  font-family:'Sarabun',sans-serif; font-size:.75rem;
  outline:none; cursor:pointer; flex-shrink:0;
}
select option { background:#222; color:#fff; }

.totals-row {
  display:flex; justify-content:flex-end; align-items:center;
  gap:16px; flex:1;
}
.total-block { text-align:center; }
.total-label { font-size:.62rem; color:#aaa; line-height:1.2; }
.total-val   { font-size:1rem; font-weight:800; line-height:1.2; }

/* ── LEGEND ── */
.legend {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:6px 14px; font-size:.68rem; color:#777;
  background:#fff; border-bottom:1px solid #e8e8e2;
  flex-shrink:0;
}
.legend-item { display:flex; align-items:center; gap:5px; white-space:nowrap; }
.legend-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.legend-dot.pick  { background:#16a34a; }
.legend-dot.label { background:#38bdf8; }
.legend-dot.pick-low { background:#16a34a; opacity:.3; }
.legend-avg-line  { width:2px; height:12px; background:rgba(0,0,0,.25); border-radius:1px; flex-shrink:0; }

/* ── OUTLIER STRIP ── */
.outlier-strip {
  display:none; align-items:center; gap:8px; flex-wrap:wrap;
  padding:4px 14px; font-size:.65rem; color:#999;
  background:#faf9f6; border-bottom:1px solid #ece8e0;
  flex-shrink:0;
}
.outlier-badge {
  background:#e5e5e0; color:#999; border-radius:20px;
  padding:2px 8px; font-size:.62rem; font-weight:600;
}

/* avg note */
.avg-note {
  font-size:.65rem; color:#aaa; text-align:right;
  padding:3px 4px 5px; flex-shrink:0;
}

.list {
  flex:1; overflow-y:auto; padding:6px 12px 20px;
}

/* ── ROW ── */
.row {
  background:#fff; border-radius:10px;
  padding:6px 12px; margin-bottom:4px;
  display:flex; align-items:center; gap:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  animation:up .22s ease both;
  cursor:pointer; position:relative;
  transition: box-shadow .15s;
}
.row:active { box-shadow:0 2px 8px rgba(0,0,0,.1); }
@keyframes up { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

/* ── CAT POPUP ── */
.cat-popup {
  display:none; position:absolute;
  top:-42px; left:50%; transform:translateX(-50%);
  background:#111; color:#fff; border-radius:12px;
  padding:6px 12px; font-size:.73rem; font-weight:600;
  white-space:nowrap; z-index:10; pointer-events:none;
  animation:pop .18s cubic-bezier(.34,1.56,.64,1);
}
.cat-popup::after {
  content:''; position:absolute; top:100%; left:50%;
  transform:translateX(-50%);
  border:5px solid transparent; border-top-color:#111;
}
@keyframes pop { from{opacity:0;transform:translateX(-50%) scale(.8)} to{opacity:1;transform:translateX(-50%) scale(1)} }
.row.show-cat .cat-popup { display:block; }

/* ── RANK ── */
.rank {
  font-size:.75rem; font-weight:800; color:#ccc;
  width:22px; text-align:center; flex-shrink:0;
}
.rank.r1 { color:#f5a800; font-size:1rem; }
.rank.r2 { color:#9e9e9e; font-size:.9rem; }
.rank.r3 { color:#a0673a; font-size:.85rem; }

/* ── NAME — fixed width, no flex:1 ── */
.name {
  font-size:.85rem; font-weight:700; color:#111;
  width:68px; min-width:68px; flex-shrink:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ── BARS section ── */
.bars { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }

.bar-line { display:flex; align-items:center; gap:5px; }

.bar-wrap {
  flex:1; height:6px; background:#eee; border-radius:3px;
  overflow:visible; position:relative;
}
.bar-fill {
  height:100%; border-radius:3px;
  transition:width .55s cubic-bezier(.34,1.56,.64,1), opacity .4s;
}

/* PICK bar — color stays green; opacity signals above/below avg */
.bar-fill.pick {
  background:#16a34a;
}
.bar-fill.pick.below-avg {
  opacity:.28;
}

/* LABEL bar — always steady cyan */
.bar-fill.label {
  background:#38bdf8;
  opacity:.75;
}

.avg-tick {
  position:absolute; top:-2px; width:2px; height:10px;
  background:rgba(0,0,0,.28); border-radius:1px; z-index:2;
}

/* ── RIGHT SIDE: gap + number ── */
.right {
  display:flex; flex-direction:column; align-items:flex-end;
  gap:1px; flex-shrink:0; min-width:52px;
}
.num-row { display:flex; align-items:center; gap:4px; }
.gap-lbl {
  font-size:.6rem; font-weight:700; line-height:1;
  min-width:28px; text-align:right;
}
.gap-lbl.pos { color:#16a34a; }
.gap-lbl.neg { color:#f97316; }
.gap-lbl.zero { color:#ccc; }

/* All numbers same color — neutral #555 */
.bar-num {
  font-size:.88rem; font-weight:700; color:#555;
  min-width:26px; text-align:right; line-height:1;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-title">📦 ผลงานวันนี้</div>
  <select id="date-select"></select>
  <div class="totals-row">
    <div class="total-block">
      <div class="total-label">พนักงาน</div>
      <div class="total-val" id="sum-people">—</div>
    </div>
    <div class="total-block">
      <div class="total-label">Pick รวม</div>
      <div class="total-val" id="sum-pick">—</div>
    </div>
    <div class="total-block">
      <div class="total-label">Label รวม</div>
      <div class="total-val" id="sum-label">—</div>
    </div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot pick"></div> PDA ≥ เฉลี่ย</div>
  <div class="legend-item"><div class="legend-dot pick-low"></div> PDA &lt; เฉลี่ย</div>
  <div class="legend-item"><div class="legend-dot label"></div> Print Label</div>
  <div class="legend-item"><div class="legend-avg-line"></div> ค่าเฉลี่ยทีม</div>
</div>

<div id="outlier-strip" class="outlier-strip">
  <span>ตัดออก:</span>
  <span id="outlier-names"></span>
</div>

<div id="avg-note" class="avg-note" style="padding-left:12px;padding-right:12px;"></div>

<div class="list" id="list"></div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxjVwLftYspE6AajyR3FcTBMa-1gcXIZPLbDzl4O4qnen3tSDr-mX97Nv8mLXHDiN4U/exec';

let RAW = [];

const getName = op => {
  const base = op.split('@')[0].replace(/st_/i,'');
  return base.charAt(0).toUpperCase() + base.slice(1);
};

const getAllDates = () =>
  [...new Set(RAW.map(r=>r.date))].sort((a,b)=>new Date(b)-new Date(a));

/* ── OUTLIER: pick < 20% of day median ── */
function detectOutliers(day) {
  if (day.length < 5) return { core: day, outliers: [] };
  const picks = [...day.map(r=>r.pda_pick)].sort((a,b)=>a-b);
  const med = picks[Math.floor(picks.length/2)];
  const threshold = med * 0.20;
  const outliers = day.filter(r => r.pda_pick < threshold);
  const core     = day.filter(r => r.pda_pick >= threshold);
  return { core, outliers, threshold: Math.round(threshold), median: Math.round(med) };
}

/* ── CAT MESSAGES ── */
function catMsg(rank, total, gapPick) {
  if (rank === 0) return '🐱 ขนนุ่มบอก: วันนี้เทพมากเลยยย~';
  if (rank === 1) return '🐱 เกือบถึงยอดแล้ว! พรุ่งนี้ขึ้นแน่!';
  if (rank === 2) return '🐱 Top 3 เลยนะ เก่งมากๆ';
  if (gapPick >= 50) return `🐱 สูงกว่าค่าเฉลี่ย +${gapPick} เก่งมากก`;
  if (gapPick >= 0)  return `🐱 อยู่เหนือค่าเฉลี่ยแล้ว ดีมากเลย!`;
  if (gapPick >= -40) return `🐱 อีกนิดเดียวก็ถึงค่าเฉลี่ยแล้วนะ!`;
  return '🐱 ไม่เป็นไร พรุ่งนี้ลองใหม่นะ 🌟';
}

let activeRow = null;

function render(date) {
  if (!date) return;
  const allDay = RAW.filter(r=>r.date===date).sort((a,b)=>b.pda_pick-a.pda_pick);
  const { core, outliers, threshold, median } = detectOutliers(allDay);

  /* outlier strip */
  const strip = document.getElementById('outlier-strip');
  if (outliers.length) {
    strip.style.display = 'flex';
    document.getElementById('outlier-names').innerHTML =
      outliers.map(r=>`<span class="outlier-badge">${getName(r.operator)} (${r.pda_pick})</span>`).join('');
  } else {
    strip.style.display = 'none';
  }

  const day = core.sort((a,b)=>b.pda_pick-a.pda_pick);
  const n = day.length || 1;
  const tPick  = allDay.reduce((s,r)=>s+r.pda_pick,0);
  const tLabel = allDay.reduce((s,r)=>s+r.print_labels,0);
  const aPick  = Math.round(day.reduce((s,r)=>s+r.pda_pick,0)/n);
  const aLabel = Math.round(day.reduce((s,r)=>s+r.print_labels,0)/n);
  const mPick  = Math.max(...day.map(r=>r.pda_pick),1);
  const mLabel = Math.max(...day.map(r=>r.print_labels),1);

  document.getElementById('sum-pick').textContent  = tPick.toLocaleString();
  document.getElementById('sum-label').textContent = tLabel.toLocaleString();
  document.getElementById('sum-people').textContent = allDay.length;

  document.getElementById('avg-note').textContent =
    `ค่าเฉลี่ยทีม (หลังตัด outlier < ${threshold} picks): Pick ${aPick} | Label ${aLabel}`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!day.length) {
    list.innerHTML='<div style="padding:32px;text-align:center;color:#aaa">ไม่มีข้อมูล</div>';
    return;
  }

  day.forEach((r, i) => {
    const rankSym  = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    const rankCls  = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const pickW    = (r.pda_pick/mPick*100).toFixed(1);
    const labelW   = (r.print_labels/mLabel*100).toFixed(1);
    const avgPW    = Math.min(aPick/mPick*100,100).toFixed(1);
    const avgLW    = Math.min(aLabel/mLabel*100,100).toFixed(1);
    const gapPick  = r.pda_pick - aPick;
    const gapLabel = r.print_labels - aLabel;
    const aboveAvg = gapPick >= 0;
    const gapCls   = gapPick > 0 ? 'pos' : gapPick < 0 ? 'neg' : 'zero';
    const gapSign  = gapPick >= 0 ? '+' : '';
    const pickBelowCls = aboveAvg ? '' : 'below-avg';
    const cat = catMsg(i, day.length, gapPick);

    const row = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = `${i*0.03}s`;
    row.innerHTML = `
      <div class="cat-popup">${cat}</div>
      <div class="rank ${rankCls}">${rankSym}</div>
      <div class="name">${getName(r.operator)}</div>
      <div class="bars">
        <div class="bar-line">
          <div class="bar-wrap">
            <div class="bar-fill pick ${pickBelowCls}" style="width:${pickW}%"></div>
            <div class="avg-tick" style="left:${avgPW}%"></div>
          </div>
        </div>
        <div class="bar-line">
          <div class="bar-wrap">
            <div class="bar-fill label" style="width:${labelW}%"></div>
            <div class="avg-tick" style="left:${avgLW}%"></div>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="num-row">
          <span class="gap-lbl ${gapCls}">${gapSign}${gapPick}</span>
          <span class="bar-num">${r.pda_pick}</span>
        </div>
        <div class="num-row">
          <span class="gap-lbl"></span>
          <span class="bar-num" style="color:#aaa;font-size:.78rem;">${r.print_labels}</span>
        </div>
      </div>`;

    row.addEventListener('click', () => {
      if (activeRow && activeRow !== row) activeRow.classList.remove('show-cat');
      row.classList.toggle('show-cat');
      activeRow = row.classList.contains('show-cat') ? row : null;
    });

    list.appendChild(row);
  });
}

function initDateSelect() {
  const dates = getAllDates();
  const sel = document.getElementById('date-select');
  const cur = sel.value;
  sel.innerHTML = '';
  dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  sel.value = dates.includes(cur) ? cur : dates[0];
  render(sel.value);
}

document.getElementById('date-select').addEventListener('change', e=>render(e.target.value));

document.addEventListener('click', e => {
  if (!e.target.closest('.row') && activeRow) {
    activeRow.classList.remove('show-cat');
    activeRow = null;
  }
});

async function loadFromSheets() {
  const list = document.getElementById('list');
  list.innerHTML = '<div style="padding:32px;text-align:center;color:#aaa">⏳ กำลังโหลดข้อมูล...</div>';
  try {
    const res  = await fetch(SHEET_URL);
    const data = await res.json();
    RAW = data;
    initDateSelect();
  } catch(e) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:#e44">❌ โหลดข้อมูลไม่สำเร็จ<br><small>ตรวจสอบการตั้งค่า Google Sheets</small></div>';
  }
}

loadFromSheets();
</script>
</body>
</html>
